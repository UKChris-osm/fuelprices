<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Finder - Forecourt Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
<style>
html,body{height:100%;margin:0}#map{width:100%;height:100%}#status{position:absolute;top:10px;left:50px;z-index:1000;padding:8px 12px;background:rgba(255,255,255,.95);border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.25);font:14px/1.4 Arial,sans-serif}
</style>
</head>
<body>
<div id="map"></div><div id="status">Loading forecourts...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script>
const status=document.getElementById('status');
const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
const markers=L.markerClusterGroup({chunkedLoading:true,chunkInterval:50,chunkDelay:10});
fetch('forecourts.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{
const bounds=[];let added=0;
for(const f of data.forecourts||[]){if(typeof f.latitude!=='number'||typeof f.longitude!=='number')continue;
const marker=L.marker([f.latitude,f.longitude]);
const address=[f.address_line_1,f.address_line_2,f.city,f.county,f.postcode].filter(Boolean).join(', ');
const popup=`<strong>${escapeHtml(f.trading_name||'Forecourt')}</strong>${f.brand_name?`<br>${escapeHtml(f.brand_name)}`:''}${address?`<br><br>${escapeHtml(address)}`:''}${f.node_id?`<br><br><small>Node ID: ${escapeHtml(f.node_id)}</small>`:''}`;
marker.bindPopup(popup);markers.addLayer(marker);bounds.push([f.latitude,f.longitude]);added++}
map.addLayer(markers);if(bounds.length)map.fitBounds(bounds,{padding:[20,20]});else map.setView([54.5,-3],6);
const generated=data.generated_at?new Date(data.generated_at).toLocaleString():'unknown';status.textContent=`${added.toLocaleString()} forecourts · generated ${generated}`;
}).catch(error=>{console.error(error);status.textContent=`Unable to load forecourt data: ${error.message}`});
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
</script>
</body>
</html>
