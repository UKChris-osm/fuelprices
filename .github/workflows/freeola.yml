name: Test Freeola Response

on:
  workflow_dispatch:

jobs:
  test-freeola:
    runs-on: ubuntu-latest

    steps:
      - name: Test Freeola fuel.php with FREEOLA token
        env:
          FREEOLA_TOKEN: ${{ secrets.FREEOLA }}
        run: |
          set +e

          URL="https://haignet.co.uk/fuel.php"
          OUTPUT=$(mktemp)

          echo "Testing POST: $URL"
          echo

          START=$(date +%s%3N)

          CURL_TIMINGS=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output "$OUTPUT" \
            --write-out "HTTP=%{http_code}\nDNS=%{time_namelookup}s\nCONNECT=%{time_connect}s\nTLS=%{time_appconnect}s\nTTFB=%{time_starttransfer}s\nTOTAL=%{time_total}s" \
            --header "Content-Type: application/json" \
            --data "{\"token\":\"${FREEOLA_TOKEN}\",\"batches\":[6]}" \
            "$URL")

          CURL_EXIT=$?

          END=$(date +%s%3N)
          ELAPSED=$((END - START))

          SIZE=$(wc -c < "$OUTPUT")

          echo "curl exit   : $CURL_EXIT"
          echo "response    : ${SIZE} bytes"
          echo
          echo "curl timings:"
          echo "$CURL_TIMINGS"
          echo
          echo "wall-clock time: ${ELAPSED} ms"
          echo
          echo "Response:"
          cat "$OUTPUT"
          echo

          rm -f "$OUTPUT"
