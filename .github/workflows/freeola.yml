name: Test Freeola Response

on:
  workflow_dispatch:

jobs:
  test-freeola:
    runs-on: ubuntu-latest

    steps:
      - name: Test Freeola fuel.php
        run: |
          set +e

          URL="https://haignet.co.uk/fuel.php"
          OUTPUT=$(mktemp)

          echo "Testing: $URL"
          echo

          START=$(date +%s%3N)

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output "$OUTPUT" \
            --write-out "%{http_code}" \
            "$URL")

          CURL_EXIT=$?

          END=$(date +%s%3N)
          ELAPSED=$((END - START))

          SIZE=$(wc -c < "$OUTPUT")

          echo "HTTP status : $HTTP_CODE"
          echo "curl exit   : $CURL_EXIT"
          echo "response    : ${SIZE} bytes"
          echo "time        : ${ELAPSED} ms"
          echo
          echo "Response preview:"
          head -c 500 "$OUTPUT"
          echo

          rm -f "$OUTPUT"
