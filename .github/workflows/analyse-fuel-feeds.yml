name: Analyse Fuel Feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Analyse provider feeds
        shell: bash
        run: |
          mkdir -p analysis-output
          cat > /tmp/analyse.ts <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";

          const FUEL_FILE = "datasets/fueldata.csv";
          const URLS_FILE = "datasets/dataurls.json";
          const OUT = "analysis-output";
          const TIMEOUT = 10_000;

          type FF = {
            nodeId: string; name: string; brand: string; postcode: string;
            latitude: string; longitude: string; prices: Record<string, number>;
          };
          type PR = {
            provider: string; providerId: string; name: string; brand: string;
            postcode: string; latitude?: number; longitude?: number;
            prices: Record<string, number>; raw: unknown;
          };

          function csvLine(s: string): string[] {
            const a: string[] = []; let x = ""; let q = false;
            for (let i = 0; i < s.length; i++) {
              const c = s[i];
              if (c === '"') {
                if (q && s[i + 1] === '"') { x += '"'; i++; }
                else q = !q;
              } else if (c === "," && !q) { a.push(x); x = ""; }
              else x += c;
            }
            a.push(x); return a;
          }

          const norm = (v: unknown) => String(v ?? "").trim().toLowerCase().replace(/\s+/g, " ");
          const pc = (v: unknown) => String(v ?? "").toUpperCase().replace(/\s+/g, "").trim();

          function num(v: unknown): number | null {
            if (typeof v === "number" && Number.isFinite(v)) return v;
            if (typeof v !== "string" || !v.trim()) return null;
            const n = Number(v.replace(/[£,\s]/g, ""));
            return Number.isFinite(n) ? n : null;
          }

          function price(v: unknown): number | null {
            const n = num(v);
            if (n === null) return null;
            return n > 0 && n < 10 ? Math.round(n * 1000) / 10 : n;
          }

          function get(o: any, path: string[]): unknown {
            let v = o;
            for (const k of path) {
              if (v == null || typeof v !== "object") return undefined;
              v = v[k];
            }
            return v;
          }

          function first(o: any, paths: string[][]): unknown {
            for (const p of paths) {
              const v = get(o, p);
              if (v !== undefined && v !== null && v !== "") return v;
            }
            return undefined;
          }

          function stations(json: any): any[] {
            if (Array.isArray(json)) return json;
            if (!json || typeof json !== "object") return [];
            for (const k of ["stations","forecourts","sites","locations","data","results"]) {
              if (Array.isArray(json[k])) return json[k];
            }
            return [];
          }

          function extractPrices(s: any): Record<string, number> {
            const out: Record<string, number> = {};
            const maps: Record<string, string[][]> = {
              E5: [["e5"],["prices","e5"],["fuelPrices","e5"],["fuel_prices","e5"],["price","e5"]],
              E10: [["e10"],["prices","e10"],["fuelPrices","e10"],["fuel_prices","e10"],["price","e10"]],
              B7S: [["b7s"],["b7"],["diesel"],["prices","b7s"],["prices","b7"],["prices","diesel"],["fuelPrices","diesel"],["fuel_prices","diesel"],["price","diesel"]],
              B7P: [["b7p"],["prices","b7p"],["fuelPrices","b7p"],["fuel_prices","b7p"],["price","b7p"]],
              B10: [["b10"],["prices","b10"],["fuelPrices","b10"],["fuel_prices","b10"],["price","b10"]],
              HVO: [["hvo"],["prices","hvo"],["fuelPrices","hvo"],["fuel_prices","hvo"],["price","hvo"]],
            };
            for (const [fuel, paths] of Object.entries(maps)) {
              for (const p of paths) {
                const n = price(get(s, p));
                if (n !== null && n > 50 && n < 500) { out[fuel] = n; break; }
              }
            }

            function walk(v: any, depth = 0) {
              if (depth > 5 || v == null || typeof v !== "object") return;
              if (Array.isArray(v)) { for (const x of v) walk(x, depth + 1); return; }
              const fuel = norm(first(v,[["fuelType"],["fuel_type"],["type"],["fuel"],["product"],["name"],["grade"]]));
              const n = price(first(v,[["price"],["value"],["amount"],["currentPrice"],["current_price"]]));
              if (n !== null && n > 50 && n < 500) {
                if (fuel.includes("e10") || fuel.includes("unleaded 95") || fuel === "unleaded") out.E10 ??= n;
                else if (fuel.includes("e5") || fuel.includes("super unleaded")) out.E5 ??= n;
                else if (fuel.includes("diesel") || fuel.includes("b7")) out.B7S ??= n;
                else if (fuel.includes("b10")) out.B10 ??= n;
                else if (fuel.includes("hvo")) out.HVO ??= n;
              }
              for (const x of Object.values(v)) walk(x, depth + 1);
            }
            walk(s);
            return out;
          }

          function parseProviders(provider: string, json: any): PR[] {
            return stations(json).filter(x => x && typeof x === "object").map(s => ({
              provider,
              providerId: String(first(s,[["node_id"],["nodeId"],["id"],["siteId"],["site_id"],["stationId"],["station_id"],["locationId"],["location_id"]]) ?? "").trim(),
              name: String(first(s,[["trading_name"],["tradingName"],["name"],["siteName"],["site_name"],["stationName"],["station_name"],["brandName"],["brand_name"]]) ?? "").trim(),
              brand: String(first(s,[["brand"],["brand_name"],["brandName"],["retailer"],["retailerName"]]) ?? "").trim(),
              postcode: pc(first(s,[["postcode"],["postCode"],["postalCode"],["postal_code"],["address","postcode"],["location","postcode"],["location","postalCode"],["location","postal_code"]])),
              latitude: num(first(s,[["latitude"],["lat"],["location","latitude"],["location","lat"]] )) ?? undefined,
              longitude: num(first(s,[["longitude"],["lng"],["lon"],["location","longitude"],["location","lng"],["location","lon"]])) ?? undefined,
              prices: extractPrices(s),
              raw: s
            }));
          }

          function parseFF(csv: string): FF[] {
            const lines = csv.split(/\r?\n/).filter(Boolean);
            if (lines.length < 2) return [];
            const h = csvLine(lines[0]);
            const ix = new Map(h.map((x,i) => [x,i]));
            const f = (r: string[], k: string) => r[ix.get(k) ?? -1] ?? "";
            const out: FF[] = [];
            for (const line of lines.slice(1)) {
              const r = csvLine(line), id = f(r,"forecourts.node_id").trim();
              if (!id) continue;
              const prices: Record<string,number> = {};
              for (const fuel of ["E5","E10","B7S","B7P","B10","HVO"]) {
                const n = num(f(r,`forecourts.fuel_price.${fuel}`));
                if (n !== null && n > 0) prices[fuel] = n;
              }
              out.push({
                nodeId:id, name:f(r,"forecourts.trading_name").trim(),
                brand:f(r,"forecourts.brand_name").trim(),
                postcode:pc(f(r,"forecourts.location.postcode")),
                latitude:f(r,"forecourts.location.latitude").trim(),
                longitude:f(r,"forecourts.location.longitude").trim(), prices
              });
            }
            return out;
          }

          function similarity(a:string,b:string):number {
            if (!a || !b) return 0;
            if (a === b) return 1;
            if (a.includes(b) || b.includes(a)) return .85;
            const A=new Set(a.split(/[^a-z0-9]+/).filter(Boolean));
            const B=new Set(b.split(/[^a-z0-9]+/).filter(Boolean));
            let n=0; for(const x of A) if(B.has(x)) n++;
            return n/Math.max(A.size,B.size);
          }

          const ff = parseFF(await readFile(FUEL_FILE,"utf8"));
          console.log(`Fuel Finder rows: ${ff.length}`);
          const byNode=new Map<string,FF[]>(), byPC=new Map<string,FF[]>();
          for(const r of ff) {
            if(!byNode.has(r.nodeId)) byNode.set(r.nodeId,[]);
            byNode.get(r.nodeId)!.push(r);
            if(r.postcode) { if(!byPC.has(r.postcode)) byPC.set(r.postcode,[]); byPC.get(r.postcode)!.push(r); }
          }
          console.log(`Fuel Finder node IDs: ${byNode.size}`);
          console.log(`Fuel Finder postcodes: ${byPC.size}`);

          const data=JSON.parse(await readFile(URLS_FILE,"utf8"));
          const providers:Record<string,string>={};
          for(const item of data.dataurls ?? []) {
            if(item && typeof item==="object" && typeof item.retailerName==="string" && typeof item.retailerURL==="string")
              providers[item.retailerName]=item.retailerURL;
          }
          console.log(`Providers discovered: ${Object.keys(providers).length}`);

          async function fetchOne(provider:string,url:string) {
            const start=Date.now();
            try {
              const res=await fetch(url,{
                headers:{ "User-Agent":"Mozilla/5.0 (compatible; FuelFinderFeedAnalysis/1.0)", Accept:"application/json,text/plain,*/*" },
                signal:AbortSignal.timeout(TIMEOUT)
              });
              const text=await res.text();
              if(!res.ok) return {provider,url,status:res.status,ms:Date.now()-start,records:[],error:`HTTP ${res.status}`};
              let json:any;
              try { json=JSON.parse(text); } catch { return {provider,url,status:res.status,ms:Date.now()-start,records:[],error:"Response was not valid JSON"}; }
              return {provider,url,status:res.status,ms:Date.now()-start,records:parseProviders(provider,json),error:""};
            } catch(e) {
              return {provider,url,status:null,ms:Date.now()-start,records:[],error:e instanceof Error?e.message:String(e)};
            }
          }

          const results=await Promise.all(Object.entries(providers).map(([p,u])=>fetchOne(p,u)));
          const rows:any[]=[];
          const summary:any[]=[];

          for(const r of results) {
            let nodeMatches=0, postcodeMatches=0, matched=0, comparisons=0;
            for(const p of r.records) {
              const node=byNode.get(p.providerId);
              if(node?.length===1) nodeMatches++;
              const pcs=byPC.get(p.postcode) ?? [];
              if(p.postcode && pcs.length) postcodeMatches++;

              let ffrow:FF|undefined;
              if(node?.length===1) ffrow=node[0];
              else if(pcs.length===1) ffrow=pcs[0];
              else if(pcs.length>1) {
                let best=0;
                for(const x of pcs) {
                  const s=similarity(norm(p.name),norm(x.name));
                  if(s>best) { best=s; ffrow=x; }
                }
                if(best<.45) ffrow=undefined;
              }

              if(!ffrow) continue;
              matched++;
              for(const fuel of Object.keys(p.prices)) {
                if(ffrow.prices[fuel] === undefined) continue;
                comparisons++;
                rows.push({
                  provider:r.provider, provider_id:p.providerId,
                  fuel_finder_node_id:ffrow.nodeId, fuel_type:fuel,
                  fuel_finder_price:ffrow.prices[fuel], provider_price:p.prices[fuel],
                  difference:Math.round((p.prices[fuel]-ffrow.prices[fuel])*10)/10,
                  fuel_finder_name:ffrow.name, provider_name:p.name, postcode:ffrow.postcode
                });
              }
            }
            summary.push({...r,records:r.records.length,nodeMatches,postcodeMatches,matched,priceComparisons:comparisons});
            console.log(`${r.provider} | HTTP ${r.status ?? "ERR"} | ${r.ms} ms | ${r.records.length} records | ${matched} matched | ${comparisons} price comparisons${r.error ? ` | ERROR: ${r.error}` : ""}`);
          }

          const esc=(v:any)=>`"${String(v??"").replaceAll('"','""')}"`;
          const header=["provider","provider_id","fuel_finder_node_id","fuel_type","fuel_finder_price","provider_price","difference","fuel_finder_name","provider_name","postcode"];
          await writeFile(`${OUT}/fuel-feed-comparison.csv`,[header.join(","),...rows.map(x=>header.map(k=>esc(x[k])).join(","))].join("\n"));
          await writeFile(`${OUT}/fuel-feed-comparison.json`,JSON.stringify(rows,null,2));
          await writeFile(`${OUT}/fuel-feed-summary.json`,JSON.stringify({generatedAt:new Date().toISOString(),fuelFinderRows:ff.length,fuelFinderNodeIds:byNode.size,fuelFinderPostcodes:byPC.size,providers:summary,totalComparisons:rows.length},null,2));
          await writeFile(`${OUT}/fuel-feed-summary.txt`,[
            `Generated: ${new Date().toISOString()}`,
            `Fuel Finder rows: ${ff.length}`,
            `Fuel Finder node IDs: ${byNode.size}`,
            `Fuel Finder postcodes: ${byPC.size}`,
            `Providers: ${summary.length}`,
            `Total price comparisons: ${rows.length}`,"",
            ...summary.map(x=>`${x.provider}: HTTP ${x.status??"ERR"}, ${x.ms} ms, ${x.records} records, ${x.matched} matched, ${x.priceComparisons} price comparisons${x.error?`, ERROR: ${x.error}`:""}`)
          ].join("\n"));
          console.log(`Analysis complete. Total price comparisons: ${rows.length}`);
          EOF
          bun /tmp/analyse.ts

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: fuel-feed-analysis
          path: analysis-output/
          if-no-files-found: error
