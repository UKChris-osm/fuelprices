name: Analyse Fuel Feeds

on:
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check Fuel Finder dataset
        run: |
          echo "Fuel Finder dataset:"
          ls -lh datasets/fueldata.csv
          echo
          echo "Lines:"
          wc -l datasets/fueldata.csv
          echo
          echo "First 3 lines:"
          head -n 3 datasets/fueldata.csv

      - name: Create analysis script
        run: |
          mkdir -p scripts analysis-output

          cat > scripts/analyse-fuel-feeds.ts <<'EOF'
          import { mkdir, readFile, writeFile } from "node:fs/promises";

          const DATASET = "datasets/fueldata.csv";
          const URLS_FILE = "datasets/dataurls.json";
          const OUTPUT_DIR = "analysis-output";

          await mkdir(OUTPUT_DIR, { recursive: true });

          function csvParse(text: string): string[][] {
            const rows: string[][] = [];
            let row: string[] = [];
            let field = "";
            let quoted = false;

            for (let i = 0; i < text.length; i++) {
              const c = text[i];

              if (quoted) {
                if (c === '"') {
                  if (text[i + 1] === '"') {
                    field += '"';
                    i++;
                  } else {
                    quoted = false;
                  }
                } else {
                  field += c;
                }
              } else {
                if (c === '"') {
                  quoted = true;
                } else if (c === ",") {
                  row.push(field);
                  field = "";
                } else if (c === "\n") {
                  row.push(field);
                  rows.push(row);
                  row = [];
                  field = "";
                } else if (c !== "\r") {
                  field += c;
                }
              }
            }

            if (field.length || row.length) {
              row.push(field);
              rows.push(row);
            }

            return rows;
          }

          function normalise(value: unknown): string {
            return String(value ?? "")
              .trim()
              .toLowerCase()
              .replace(/\s+/g, " ");
          }

          function number(value: unknown): number | null {
            if (value === null || value === undefined || value === "") {
              return null;
            }

            const n = Number(String(value).replace(/,/g, ""));
            return Number.isFinite(n) ? n : null;
          }

          function findColumn(
            columns: string[],
            candidates: string[],
          ): number {
            const normalised = columns.map(normalise);

            for (const candidate of candidates) {
              const wanted = normalise(candidate);
              const index = normalised.indexOf(wanted);

              if (index !== -1) {
                return index;
              }
            }

            return -1;
          }

          function csvEscape(value: unknown): string {
            const text = String(value ?? "");

            if (
              text.includes(",") ||
              text.includes('"') ||
              text.includes("\n") ||
              text.includes("\r")
            ) {
              return `"${text.replace(/"/g, '""')}"`;
            }

            return text;
          }

          function rowsToCsv(
            rows: Record<string, unknown>[],
            columns: string[],
          ): string {
            const output = [
              columns.map(csvEscape).join(","),
              ...rows.map((row) =>
                columns.map((column) => csvEscape(row[column])).join(",")
              ),
            ];

            return output.join("\n") + "\n";
          }

          async function fetchFeed(
            name: string,
            url: string,
          ): Promise<{
            name: string;
            url: string;
            ok: boolean;
            status: number | null;
            bytes: number;
            elapsed_ms: number;
            error: string | null;
            content_type: string;
            body: string;
          }> {
            const start = performance.now();

            try {
              const response = await fetch(url, {
                headers: {
                  "User-Agent":
                    "Mozilla/5.0 (compatible; FuelFeedAnalysis/1.0)",
                  Accept: "application/json,text/plain,*/*",
                },
              });

              const body = await response.text();
              const elapsed = Math.round(performance.now() - start);

              return {
                name,
                url,
                ok: response.ok,
                status: response.status,
                bytes: Buffer.byteLength(body),
                elapsed_ms: elapsed,
                error: null,
                content_type:
                  response.headers.get("content-type") ?? "",
                body,
              };
            } catch (error) {
              return {
                name,
                url,
                ok: false,
                status: null,
                bytes: 0,
                elapsed_ms: Math.round(performance.now() - start),
                error:
                  error instanceof Error
                    ? error.message
                    : String(error),
                content_type: "",
                body: "",
              };
            }
          }

          function findArray(value: unknown): unknown[] | null {
            if (Array.isArray(value)) {
              return value;
            }

            if (!value || typeof value !== "object") {
              return null;
            }

            const object = value as Record<string, unknown>;

            for (const key of [
              "stations",
              "forecourts",
              "sites",
              "data",
              "results",
              "prices",
              "fuel_prices_
