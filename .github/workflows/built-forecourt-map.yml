name: Build Forecourt Data

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-forecourt-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build forecourt data
        run: bun scripts/build-forecourt-data.ts

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/forecourts.json docs/fuelprices-csv.json

          if git diff --cached --quiet; then
            echo "No changes to generated data."
            exit 0
          fi

          git commit -m "Update forecourt and CSV fuel price data"
          git push

      - name: Deploy website
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
