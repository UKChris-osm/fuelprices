      - name: Test retailer feeds
        shell: bash
        run: |
          echo "Testing retailer feeds from GitHub Actions runner"
          echo

          jq -r '.dataurls[] | [.retailerName, .retailerURL] | @tsv' \
            datasets/dataurls.json |
          while IFS=$'\t' read -r name url; do

            echo "=================================================="
            echo "$name"
            echo "$url"

            tmp=$(mktemp)
            error=$(mktemp)

            start=$(date +%s%3N)

            set +e
            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$tmp" \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$url" 2>"$error")
            curl_exit=$?
            set -e

            end=$(date +%s%3N)
            elapsed=$((end - start))

            size=$(wc -c < "$tmp")

            if [ "$curl_exit" -eq 0 ]; then
              if jq empty "$tmp" 2>/dev/null; then
                json="YES"
              else
                json="NO"
              fi
            else
              json="N/A"
            fi

            echo "HTTP:     ${http_code:-N/A}"
            echo "curl:     $curl_exit"
            echo "Size:     $size bytes"
            echo "Time:     ${elapsed} ms"
            echo "JSON:     $json"

            if [ -s "$error" ]; then
              echo "Error:"
              cat "$error"
            fi

            rm -f "$tmp" "$error"

          done
