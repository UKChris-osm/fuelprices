name: Test Retailer Fuel Feeds

on:
  workflow_dispatch:

jobs:
  test-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test retailer feeds
        shell: bash
        run: |
          echo "Testing retailer feeds from GitHub Actions runner"
          echo

          jq -r '.dataurls[] | [.retailerName, .retailerURL] | @tsv' \
            datasets/dataurls.json |
          while IFS=$'\t' read -r name url; do

            echo "=================================================="
            echo "$name"
            echo "$url"

            tmp=$(mktemp)
            start=$(date +%s%3N)

            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$tmp" \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$url" 2>/tmp/curl-error)

            end=$(date +%s%3N)
            elapsed=$((end - start))

            size=$(wc -c < "$tmp")

            if jq empty "$tmp" 2>/dev/null; then
              json="YES"
            else
              json="NO"
            fi

            echo "HTTP:     $http_code"
            echo "Size:     $size bytes"
            echo "Time:     ${elapsed} ms"
            echo "JSON:     $json"

            if [ -s /tmp/curl-error ]; then
              echo "curl error:"
              cat /tmp/curl-error
            fi

            rm -f "$tmp" /tmp/curl-error

          done
